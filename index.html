<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>도면3D</title>
    <meta name="description" content="2D 기계 도면을 그리면 3D 모델이 자동으로 만들어지고, AI가 설계 오류를 찾아 주는 CAD 앱" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="appbar">
      <div class="brand"><span class="logo">◧</span> 도면3D</div>
      <div class="menu-wrap">
        <button class="ghost" data-menu="file">파일 ▾</button>
        <div class="dropdown" id="menu-file" hidden>
          <button data-act="new">새 부품 <kbd>Ctrl+Alt+N</kbd></button>
          <button data-act="open">열기… <kbd>Ctrl+O</kbd></button>
          <button data-act="save">저장… <kbd>Ctrl+S</kbd></button>
          <hr />
          <div class="dd-label">예제 불러오기</div>
          <div id="samples"></div>
        </div>
      </div>
      <input id="name" class="name" aria-label="부품 이름" spellcheck="false" />
      <nav class="ws-tabs" role="tablist">
        <button data-ws="design" class="active" role="tab" title="2D 설계 (1)">✎ 2D 설계</button>
        <button data-ws="3d" role="tab" title="3D 보기 (2)">◈ 3D 보기</button>
        <button data-ws="sheet" role="tab" title="도면 출력 (3)">▤ 도면 출력</button>
      </nav>
      <div class="spacer"></div>
      <button id="aiBtn" class="primary">✦ AI 설계 검토</button>
      <button id="settingsBtn" class="ghost icon" title="설정" aria-label="설정">⚙</button>
    </header>

    <div class="ribbon" id="ribbon">
      <div class="group">
        <div class="tools">
          <button data-tool="select" title="선택·이동 (V)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l10 6-4.5 1.2L13 16l-2 1-2.4-5.6L5 14z"/></svg>선택<kbd>V</kbd></button>
          <button data-tool="rect" title="사각형 (R)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="14" height="10" rx="0.5"/></svg>사각형<kbd>R</kbd></button>
          <button data-tool="circle" title="원 (C)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/></svg>원<kbd>C</kbd></button>
          <button data-tool="poly" title="다각형 (L)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3l7 5-2.7 8.5H5.7L3 8z"/></svg>다각형<kbd>L</kbd></button>
          <button data-tool="slot" title="장공 (S)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6.5" width="15" height="7" rx="3.5"/><circle cx="6" cy="10" r="0.6" fill="currentColor"/><circle cx="14" cy="10" r="0.6" fill="currentColor"/></svg>장공<kbd>S</kbd></button>
          <button data-tool="hole" title="규격 구멍 (D) — 볼트 관통·탭·카운터보어·카운터싱크·깊이"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3.5"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3"/></svg>구멍<kbd>D</kbd></button>
        </div>
        <div class="glabel">그리기</div>
      </div>
      <div class="group">
        <div class="tools">
          <button id="holeBtn" title="몸체 ↔ 구멍 (H)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="0.5"/><circle cx="10" cy="10" r="3" stroke-dasharray="2 1.5"/></svg>구멍 전환<kbd>H</kbd></button>
          <button id="dupBtn" title="복제 (Ctrl+D)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>복제<kbd>⌃D</kbd></button>
          <button id="delBtn" title="삭제 (Delete)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2M6 6l1 11h6l1-11"/></svg>삭제<kbd>Del</kbd></button>
          <button id="undoBtn" title="실행 취소 (Ctrl+Z)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5L3 9l4 4"/><path d="M3 9h9a5 5 0 010 10h-2"/></svg>취소<kbd>⌃Z</kbd></button>
          <button id="redoBtn" title="다시 실행 (Ctrl+Shift+Z)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5l4 4-4 4"/><path d="M17 9H8a5 5 0 000 10h2"/></svg>다시<kbd>⌃⇧Z</kbd></button>
        </div>
        <div class="glabel">편집</div>
      </div>
      <div class="group">
        <div class="tools">
          <button data-tool="corner" title="모서리 R / 모따기 (E)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17V9a6 6 0 016-6h8"/><path d="M3 17h14" stroke-dasharray="1.5 2"/></svg>모서리<kbd>E</kbd></button>
          <div class="corner-opts">
            <div class="seg">
              <button data-corner="fillet" title="둥글게 (R)">R</button>
              <button data-corner="chamfer" title="모따기 (C)">C</button>
            </div>
            <span class="unit"><input id="cornerSize" type="number" min="0.1" step="0.5" title="모서리 크기" />mm</span>
          </div>
          <button data-tool="measure" title="측정 (M)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 13.5l11-11 4 4-11 11z"/><path d="M6 10l1.5 1.5M8.5 7.5l1.5 1.5M11 5l1.5 1.5"/></svg>측정<kbd>M</kbd></button>
        </div>
        <div class="glabel">모서리 · 측정</div>
      </div>
      <div class="group">
        <div class="fields">
          <label>방식
            <select id="mode">
              <option value="auto">자동 (돌출·교집합)</option>
              <option value="revolve">회전체</option>
            </select>
          </label>
          <label id="thicknessWrap" title="뷰를 1개만 그렸을 때 돌출 두께">두께 <span class="unit"><input id="thickness" type="text" spellcheck="false" />mm</span></label>
        </div>
        <div class="glabel">3D 생성</div>
      </div>
      <div class="group">
        <div class="fields">
          <label>제조 방식
            <select id="process">
              <option value="cnc">CNC 가공</option>
              <option value="print3d">3D 프린팅</option>
              <option value="laser">판금 · 레이저</option>
            </select>
          </label>
        </div>
        <div class="glabel">검사 기준</div>
      </div>
      <div class="group">
        <div class="fields">
          <label>격자
            <select id="grid">
              <option value="0.1">0.1 mm</option><option value="0.5">0.5 mm</option><option value="1">1 mm</option>
              <option value="5">5 mm</option><option value="10">10 mm</option>
            </select>
          </label>
          <button id="fitBtn" class="small">전체 보기 <kbd>F</kbd></button>
        </div>
        <div class="glabel">보기</div>
      </div>
    </div>

    <main id="ws-main" class="workspace">
      <aside class="panel left">
        <div class="panel-head">모델 트리</div>
        <div id="tree" class="tree"></div>
        <div class="panel-head params-head">
          변수
          <button id="addParam" class="small" title="변수 추가">+ 추가</button>
        </div>
        <div id="params" class="params"></div>
      </aside>

      <section class="stage">
        <!-- 2D 설계: 세 뷰를 한 장의 제도판에 (3각법 배치) -->
        <div id="stage-design" class="stage-pane">
          <canvas id="board" tabindex="0"></canvas>
          <div class="board-tools">
            <div class="seg" role="group" aria-label="보기">
              <button data-focus="all" class="on" title="세 뷰 모두 (F)">전체</button>
              <button data-focus="front" title="정면도만 크게">정면</button>
              <button data-focus="top" title="평면도만 크게">평면</button>
              <button data-focus="side" title="우측면도만 크게">우측</button>
            </div>
          </div>
          <div id="buildOverlay" class="build-overlay" hidden></div>
        </div>

        <!-- 3D 보기: 전체 화면 -->
        <div id="stage-3d" class="stage-pane stage-3d" hidden>
          <div class="stage-toolbar">
            <div class="seg" role="group" aria-label="시점">
              <button data-cam="iso">등각</button><button data-cam="front">정면</button><button data-cam="top">평면</button><button data-cam="side">우측</button>
            </div>
            <span id="info3d" class="muted"></span>
            <div class="spacer"></div>
            <button id="expStl3d" title="3D 프린팅용">STL 저장</button>
            <button id="expStep3d" title="다른 CAD용">STEP 저장</button>
            <button id="back2d" class="primary">✎ 2D 설계로 <kbd>1</kbd></button>
          </div>
          <div id="viewer3d" class="viewer3d"></div>
        </div>
      </section>

      <aside class="panel right">
        <section class="props">
          <div class="panel-head">속성</div>
          <div id="props" class="props-body"></div>
        </section>
        <section class="checks">
          <div class="panel-head">
            설계 검사
            <span id="checkCounts" class="counts"></span>
          </div>
          <div id="aiSummary" class="ai-summary" hidden></div>
          <div id="findings" class="findings"></div>
        </section>
      </aside>
    </main>

    <main id="ws-sheet" class="workspace sheet-ws" hidden>
      <div class="sheet-toolbar">
        <span class="muted">3D 모델에서 자동 생성된 3각법 3면도</span>
        <span id="sheetInfo" class="sheet-badge"></span>
        <div class="spacer"></div>
        <button id="expSvg">SVG 저장</button>
        <button id="expDxf" title="실제 크기(1:1) — 선·원호·중심선·치수 레이어">DXF 저장 (AutoCAD)</button>
        <button id="expStl">STL 저장 (3D 프린팅)</button>
        <button id="expStep">STEP 저장 (CAD)</button>
        <button id="printBtn" class="primary" title="용지 크기 그대로 인쇄하거나 PDF로 저장">인쇄 / PDF</button>
      </div>
      <div class="sheet-body">
        <aside class="sheet-settings" id="sheetSettings">
          <div class="panel-head">도면 설정</div>
          <div class="sheet-form">
            <label>용지 (가로)
              <select data-sheet="paper">
                <option value="auto">자동</option><option value="A4">A4</option><option value="A3">A3</option><option value="A2">A2</option>
              </select>
            </label>
            <label>척도
              <select data-sheet="scale">
                <option value="auto">자동</option>
                <option>5:1</option><option>2:1</option><option>1:1</option><option>1:2</option><option>1:5</option><option>1:10</option><option>1:20</option><option>1:50</option>
              </select>
            </label>
            <div class="form-sep">표제란</div>
            <label>재질 <input data-sheet="material" placeholder="예: SM45C, AL6061" /></label>
            <label>수량 <input data-sheet="qty" placeholder="1" /></label>
            <label>설계 <input data-sheet="drawnBy" placeholder="이름" /></label>
            <label>일반 공차 <input data-sheet="tolerance" placeholder="KS B ISO 2768-m" /></label>
            <label>주기 (한 줄에 하나)
              <textarea data-sheet="note" rows="4" placeholder="지시 없는 모따기 C0.5&#10;날카로운 모서리 제거"></textarea>
            </label>
            <p class="muted small">부품명은 위쪽 이름 칸을 씁니다. DXF는 실제 크기(1:1)로 저장됩니다.</p>
          </div>
        </aside>
        <div id="sheetHost" class="sheet-host"></div>
      </div>
    </main>

    <footer class="statusbar">
      <span id="coords" class="coords">X — · Y — · Z —</span>
      <span id="toolHint" class="hint"></span>
      <div class="spacer"></div>
      <button id="snapGridBtn" class="toggle" title="격자에 붙기 (G)">격자 스냅</button>
      <button id="snapAlignBtn" class="toggle" title="다른 도형·뷰에 정렬 (A)">정렬 스냅</button>
      <button id="resultBtn" class="toggle" title="3D 결과를 각 2D 창에 흐리게 겹쳐 보기">결과 겹쳐 보기</button>
      <span id="buildStatus" class="build-status"></span>
    </footer>

    <dialog id="settings">
      <form method="dialog">
        <h2>설정</h2>
        <label class="block">Anthropic API 키
          <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false" />
        </label>
        <p class="note">
          AI 설계 검토는 Claude(<code id="aiModel"></code>)를 사용합니다. 키는 <b>이 컴퓨터의 브라우저에만</b> 저장되고,
          검토를 요청할 때 Anthropic API로만 전송됩니다. 키는 <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Anthropic Console</a>에서 만들 수 있어요.
        </p>
        <div class="dialog-actions">
          <button value="cancel" class="ghost">취소</button>
          <button id="saveSettings" value="ok" class="primary">저장</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
